<title>Baby Zuccio vs Turtles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one sky-blue screen, game canvas centered, controls under it. Single bright look in both themes. */
  :root {
    --sky-top: #5ab4f0;
    --sky-bottom: #c9ecff;
    --ink: #1d2a44;
    --sun: #ffd23f;
    --shell: #3f9b4a;
    --card: #ffffffcc;
    --display: "Bungee", "Impact", system-ui, sans-serif;
    --body: "Nunito", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    color: var(--ink);
    font-family: var(--body);
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 16px; box-sizing: border-box; gap: 8px; overflow: hidden;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; width: 100%; max-width: 480px; flex-wrap: wrap; }
  h1 { font-family: var(--display); font-size: 1.3rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
  button {
    font-family: var(--display); font-size: .85rem; color: var(--ink);
    background: var(--sun); border: 3px solid var(--ink); border-radius: 10px;
    padding: 6px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--ink);
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .bar .btns { display: flex; gap: 8px; }
  #wrap { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: center; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 12px; background: var(--sky-top); }
  .ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 16px 9%; box-sizing: border-box; }
  .ov[hidden] { display: none; }
  .ov.center { justify-content: center; }
  .ov.dim { background: #1d2a4466; border-radius: 12px; }
  .card { background: var(--card); border: 3px solid var(--ink); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(320px, 100%); box-sizing: border-box; text-align: center; }
  .card h2 { font-family: var(--display); margin: 0; font-size: 1.4rem; }
  .card p { margin: 0; font-weight: 800; }
  .ov .big { font-size: 1.1rem; padding: 10px 24px; width: min(240px, 100%); }
  label { font-weight: 800; font-size: .85rem; display: flex; gap: 8px; align-items: center; }
  input { font: 800 1rem var(--body); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 8px; padding: 4px 8px; width: 9em; }
  .tap { font-size: .85rem; opacity: .8; }
  #boardCard { max-height: 88%; justify-content: flex-start; }
  #rows { list-style: none; margin: 0; padding: 0; width: 100%; overflow-y: auto; min-height: 0; flex: 1; }
  #rows li { display: grid; grid-template-columns: 2em 1fr auto; gap: 8px; padding: 6px 4px; border-bottom: 2px dashed #1d2a4433; font-weight: 800; text-align: left; font-variant-numeric: tabular-nums; }
  #rows li.me { background: var(--sun); border-radius: 6px; }
  #rows li span:first-child { font-family: var(--display); }
  #rows li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .note { font-size: .8rem; font-weight: 600; }
  .touch { display: flex; gap: 8px; width: 100%; max-width: 480px; }
  .touch button { flex: 1; padding: 12px 4px; font-size: .8rem; }
  .help { font-size: .8rem; margin: 0; text-align: center; }
  @media (hover: hover) and (pointer: fine) { .touch { display: none; } }
</style>

<div class="bar">
  <h1>Baby Zuccio vs Turtles</h1>
  <div class="btns">
    <button id="pause" hidden>Pause</button>
    <button id="music">Music: ON</button>
  </div>
</div>
<div id="wrap"><div id="stage">
  <canvas id="c" width="480" height="720"></canvas>
  <div class="ov" id="menu">
    <label for="name">Your name <input id="name" maxlength="12" placeholder="Player" autocomplete="off"></label>
    <button class="big" id="play">Play</button>
    <button class="big" id="lb">Leaderboard</button>
  </div>
  <div class="ov center dim" id="board" hidden>
    <div class="card" id="boardCard">
      <h2>Leaderboard</h2>
      <ol id="rows"></ol>
      <p class="note" id="boardNote">Loading scores…</p>
      <button id="back">Back</button>
    </div>
  </div>
  <div class="ov center dim" id="paused" hidden>
    <div class="card"><h2>Paused</h2><button class="big" id="resume">Resume</button><p class="tap">or press P</p></div>
  </div>
  <div class="ov center dim" id="over" hidden>
    <div class="card">
      <h2>Game over</h2>
      <p id="overScore"></p>
      <p class="note" id="saveNote"></p>
      <p class="tap">Tap anywhere for the main menu</p>
    </div>
  </div>
</div></div>
<p class="help">← → move · Space = hand lightning · X or ↑ = eye lasers · P = pause</p>
<div class="touch">
  <button id="tl">◀</button>
  <button id="tz">⚡ Zap</button>
  <button id="tx">👀 Laser</button>
  <button id="tr">▶</button>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 480, H = 720;

// ---------- AUDIO ----------
let ac = null, musicOn = true, musicTimer = null, nextNote = 0, step = 0;
function audio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, t, dur, type, vol, opts = {}) {
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t + dur);
  let out = o;
  if (opts.kazoo) {
    const lfo = a.createOscillator(), lg = a.createGain();
    lfo.frequency.value = 7; lg.gain.value = freq * 0.03;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + dur);
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 2;
    o.connect(bp); out = bp;
  }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  out.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(t, dur, vol, hp = 1000) {
  const a = audio(), len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
const semi = n => 220 * Math.pow(2, n / 12);
// Frantic circus-polka melody (semitones from A3), null = rest. 32 sixteenth steps.
const MEL = [12,null,12,13,12,null,11,12, 15,null,15,16,15,null,13,15, 19,18,19,18,19,null,15,null, 17,15,13,12,11,12,13,null];
const BASS = [0,null,7,null,0,null,7,null, 3,null,10,null,3,null,10,null, 7,null,14,null,7,null,14,null, 5,null,8,null,7,null,-1,null];
function scheduleMusic() {
  const a = audio(), spb = 60 / 176 / 4; // 176 bpm sixteenths
  while (nextNote < a.currentTime + 0.12) {
    const s = step % 32, bar = Math.floor(step / 32) % 4;
    const up = bar === 3 ? 5 : bar === 2 ? 2 : 0; // key change for drama
    if (MEL[s] !== null) tone(semi(MEL[s] + up), nextNote, spb * 1.6, 'sawtooth', 0.09, { kazoo: true });
    if (BASS[s] !== null) tone(semi(BASS[s] + up - 24), nextNote, spb * 1.4, 'square', 0.08);
    if (s % 4 === 0) tone(150, nextNote, 0.12, 'sine', 0.35, { slide: 40 });
    if (s % 8 === 4) noise(nextNote, 0.1, 0.18, 1500);
    if (s % 2 === 1) noise(nextNote, 0.03, 0.05, 7000);
    if (s === 31 && bar === 3) tone(semi(24 + up), nextNote, 0.3, 'square', 0.06, { slide: semi(36 + up) }); // slide whistle
    nextNote += spb; step++;
  }
}
function startMusic() {
  if (!musicOn || musicTimer) return;
  nextNote = audio().currentTime + 0.05;
  musicTimer = setInterval(scheduleMusic, 25);
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }
const musicBtn = document.getElementById('music');
musicBtn.onclick = () => {
  musicOn = !musicOn;
  musicBtn.textContent = 'Music: ' + (musicOn ? 'ON' : 'OFF');
  if (musicOn && state === 'play') startMusic(); else stopMusic();
  musicBtn.blur();
};
const sfx = {
  zap() { const t = audio().currentTime; noise(t, 0.15, 0.12, 3000); tone(900, t, 0.12, 'square', 0.05, { slide: 200 }); },
  laser() { const t = audio().currentTime; tone(1800, t, 0.18, 'sawtooth', 0.06, { slide: 300 }); },
  bonk() { const t = audio().currentTime; tone(500, t, 0.15, 'triangle', 0.25, { slide: 120 }); },
  dive() { const t = audio().currentTime; tone(1200, t, 0.45, 'sine', 0.08, { slide: 300 }); },
  ouch() { const t = audio().currentTime; tone(600, t, 0.5, 'square', 0.12, { slide: 80 }); },
};

// ---------- GAME ----------
let state = 'title', score = 0, lives = 3, wave = 1, best = 0;
try { best = +localStorage.getItem('bvt-best') || 0; } catch (e) {}
const baby = { x: W / 2, y: H - 60, w: 50, cool: 0, lcool: 0, hurt: 0 };
let turtles = [], bolts = [], lasers = [], spits = [], pops = [], clouds = [];
let dir = 1, tSpeed = 30, shake = 0, diveTimer = 3;
// where a turtle actually is: its formation slot, or its dive path
const pos = t => t.dive || t;
const keys = {};

for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: Math.random() * H * 0.8, s: 0.6 + Math.random() * 0.8, v: 6 + Math.random() * 10 });

function newWave() {
  turtles = [];
  const rows = Math.min(3 + wave, 6), cols = 7;
  const divers = Math.min(2 + wave, 7);
  for (let i = 0; i < divers; i++)
    turtles.push({ x: 240 + (i - (divers - 1) / 2) * 58, y: 70, alive: true, hp: 1, wob: Math.random() * 6, diver: true, dive: null });
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    turtles.push({ x: 60 + c * 58, y: 120 + r * 46, alive: true, hp: r === 0 && wave > 1 ? 2 : 1, wob: Math.random() * 6 });
  diveTimer = 2.5; dir = 1; tSpeed = 26 + wave * 8; spits = []; bolts = []; lasers = [];
}
function reset() { score = 0; lives = 3; wave = 1; baby.x = W / 2; baby.hurt = 0; newWave(); state = 'play'; startMusic(); }

function zigzag(x, y) { const pts = []; for (let i = 0; i < 6; i++) pts.push((Math.random() - 0.5) * 10); return { x, y, pts, vy: -520 }; }
function fireBolts() {
  if (baby.cool > 0) return; baby.cool = 0.28;
  bolts.push(zigzag(baby.x - 26, baby.y - 4), zigzag(baby.x + 26, baby.y - 4)); sfx.zap();
}
function fireLaser() {
  if (baby.lcool > 0) return; baby.lcool = 0.9;
  lasers.push({ x: baby.x, y: baby.y - 38, life: 0.22, hit: false }); sfx.laser();
}

function hitTurtle(t) {
  t.hp--; sfx.bonk();
  const p = pos(t);
  if (t.hp <= 0) { t.alive = false; score += (t.dive ? 50 : t.diver ? 20 : 10) * wave; pops.push({ x: p.x, y: p.y, life: 0.5, flip: true }); }
  else pops.push({ x: p.x, y: p.y, life: 0.25 });
}

function update(dt) {
  clouds.forEach(c => { c.x += c.v * dt; if (c.x > W + 80) c.x = -80; });
  pops = pops.filter(p => (p.life -= dt) > 0);
  if (shake > 0) shake -= dt;
  if (state !== 'play') return;

  const sp = 260;
  if (keys.ArrowLeft || keys.a || keys.L) baby.x -= sp * dt;
  if (keys.ArrowRight || keys.d || keys.R) baby.x += sp * dt;
  baby.x = Math.max(30, Math.min(W - 30, baby.x));
  baby.cool -= dt; baby.lcool -= dt; baby.hurt -= dt;
  if (keys[' '] || keys.Z) fireBolts();
  if (keys.x || keys.ArrowUp || keys.X) fireLaser();

  // turtles march
  const alive = turtles.filter(t => t.alive);
  const speed = tSpeed + (1 - alive.length / turtles.length) * 90;
  let edge = false;
  alive.forEach(t => { t.x += dir * speed * dt; t.wob += dt * 8; if (!t.dive && (t.x < 26 || t.x > W - 26)) edge = true; });
  if (edge) { dir *= -1; alive.forEach(t => { t.x += dir * 4; t.y += 18; }); }
  // flying turtles peel off and swoop down Galaga-style
  diveTimer -= dt;
  if (diveTimer <= 0) {
    diveTimer = Math.max(1, 3.2 - wave * 0.35) * (0.7 + Math.random() * 0.6);
    const ready = alive.filter(t => t.diver && !t.dive);
    if (ready.length) {
      const t = ready[Math.floor(Math.random() * ready.length)];
      const side = t.x < W / 2 ? -1 : 1;
      t.dive = { x: t.x, y: t.y, vx: side * 140, vy: -230, phase: 'swoop', time: 0, spat: 0, ang: 0 };
      sfx.dive();
    }
  }
  alive.forEach(t => {
    const d = t.dive; if (!d) return;
    d.time += dt;
    if (d.phase === 'swoop') {
      d.vy = Math.min(d.vy + 520 * dt, 260 + wave * 20);         // arc up, then plunge
      const want = (baby.x - d.x) * 1.6 + Math.sin(d.time * 5) * 120; // home in on the baby, wiggling
      d.vx += (want - d.vx) * Math.min(1, dt * 2.5);
      d.x = Math.max(16, Math.min(W - 16, d.x + d.vx * dt)); d.y += d.vy * dt;
      d.ang = Math.atan2(d.vy, d.vx) - Math.PI / 2;
      if (d.spat < 2 && d.y > 200 + d.spat * 140 && d.y < baby.y - 120) { d.spat++; spits.push({ x: d.x, y: d.y + 16, vy: d.vy + 120 }); }
      if (baby.hurt <= 0 && Math.abs(d.x - baby.x) < 26 && Math.abs(d.y - (baby.y - 10)) < 34) { t.alive = false; pops.push({ x: d.x, y: d.y, life: 0.5, flip: true }); ouch(); }
      if (d.y > H + 30) { d.phase = 'home'; d.y = -30; d.x = t.x; }
    } else { // fly back into its slot from the top
      const dx = t.x - d.x, dy = t.y - d.y, dist = Math.hypot(dx, dy), step = 260 * dt;
      d.ang = Math.atan2(dy, dx) - Math.PI / 2;
      if (dist <= step) t.dive = null; else { d.x += dx / dist * step; d.y += dy / dist * step; }
    }
  });

  // turtles spit
  if (alive.length && Math.random() < dt * (0.9 + wave * 0.35)) {
    const t = alive[Math.floor(Math.random() * alive.length)];
    if (t.alive && !t.dive) spits.push({ x: t.x, y: t.y + 16, vy: 150 + wave * 15 });
  }

  bolts.forEach(b => { b.y += b.vy * dt; });
  bolts = bolts.filter(b => {
    if (b.y < -30) return false;
    for (const t of alive) { const p = pos(t); if (t.alive && Math.abs(b.x - p.x) < 22 && Math.abs(b.y - p.y) < 18) { hitTurtle(t); return false; } }
    return true;
  });
  lasers = lasers.filter(l => {
    if (!l.hit) { // eye lasers hit every turtle in a narrow column
      l.hit = true;
      alive.forEach(t => { if (t.alive && Math.abs(pos(t).x - l.x) < 26) hitTurtle(t); });
      shake = 0.12;
    }
    return (l.life -= dt) > 0;
  });
  spits.forEach(s => s.y += s.vy * dt);
  spits = spits.filter(s => {
    if (s.y > H) return false;
    if (baby.hurt <= 0 && Math.abs(s.x - baby.x) < 22 && Math.abs(s.y - (baby.y - 10)) < 30) { ouch(); return false; }
    return true;
  });

  if (alive.some(t => t.alive && t.y > baby.y - 40)) { lives = 0; ouch(); }
  if (!turtles.some(t => t.alive)) { wave++; score += 100; newWave(); }
}
function ouch() {
  lives--; baby.hurt = 1.5; shake = 0.3; sfx.ouch();
  if (lives <= 0) {
    state = 'over'; stopMusic();
    if (score > best) { best = score; try { localStorage.setItem('bvt-best', best); } catch (e) {} }
    show('over'); submitScore();
  }
}

// ---------- DRAW ----------
function drawCloud(c) {
  ctx.fillStyle = '#ffffffd9';
  ctx.beginPath();
  [[0, 0, 22], [22, -8, 26], [46, 0, 20], [22, 8, 22]].forEach(([dx, dy, r]) => {
    ctx.moveTo(c.x + dx * c.s + r * c.s, c.y + dy * c.s); ctx.arc(c.x + dx * c.s, c.y + dy * c.s, r * c.s, 0, 7);
  });
  ctx.fill();
}
function drawTurtle(t) {
  const legs = Math.sin(t.wob) * 3;
  const p = pos(t);
  ctx.save(); ctx.translate(p.x, p.y);
  if (t.dive) ctx.rotate(t.dive.ang);
  ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 2;
  if (t.diver) { // flapping wings
    const flap = 0.6 + Math.abs(Math.sin(t.wob * (t.dive ? 2.5 : 1))) * 0.6;
    ctx.fillStyle = '#ffffff';
    [-1, 1].forEach(sd => { ctx.beginPath(); ctx.ellipse(sd * 22, -4, 14, 7 * flap, sd * -0.5, 0, 7); ctx.fill(); ctx.stroke(); });
  }
  ctx.fillStyle = '#8fd16a';
  // legs
  [[-14, 10], [14, 10], [-14, -6], [14, -6]].forEach(([lx, ly], i) => {
    ctx.beginPath(); ctx.ellipse(lx + (i % 2 ? 4 : -4), ly + (i < 2 ? legs : -legs), 6, 4, 0, 0, 7); ctx.fill(); ctx.stroke();
  });
  // head (looks down at baby)
  ctx.beginPath(); ctx.arc(0, 16, 8, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1d2a44'; ctx.beginPath(); ctx.arc(-3, 18, 1.6, 0, 7); ctx.arc(3, 18, 1.6, 0, 7); ctx.fill();
  // shell
  ctx.fillStyle = t.diver ? '#e8473c' : t.hp > 1 ? '#2e6b8f' : '#3f9b4a';
  ctx.beginPath(); ctx.ellipse(0, 0, 19, 15, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#ffffff66'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.lineTo(Math.cos(a) * 7, Math.sin(a) * 6); }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}
function drawBaby() {
  if (baby.hurt > 0 && Math.floor(baby.hurt * 10) % 2) return;
  const { x, y } = baby;
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.fillStyle = '#ffd9b8';
  // arms out to the sides, hands up
  ctx.beginPath(); ctx.moveTo(-12, 8); ctx.lineTo(-26, -2); ctx.moveTo(12, 8); ctx.lineTo(26, -2); ctx.stroke();
  ctx.beginPath(); ctx.arc(-26, -4, 5, 0, 7); ctx.arc(26, -4, 5, 0, 7); ctx.fill(); ctx.stroke();
  // diaper body
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(0, 18, 14, 13, 0, 0, 7); ctx.fill(); ctx.stroke();
  // head
  ctx.fillStyle = '#ffd9b8';
  ctx.beginPath(); ctx.arc(0, -16, 18, 0, 7); ctx.fill(); ctx.stroke();
  // the one curly hair
  ctx.beginPath(); ctx.moveTo(0, -34);
  ctx.bezierCurveTo(-2, -44, 8, -48, 9, -42); ctx.bezierCurveTo(10, -37, 3, -37, 4, -41); ctx.stroke();
  // eyes (glow when laser is ready)
  const ready = baby.lcool <= 0;
  ctx.fillStyle = ready ? '#ff2d55' : '#1d2a44';
  ctx.beginPath(); ctx.arc(-6, -18, 2.6, 0, 7); ctx.arc(6, -18, 2.6, 0, 7); ctx.fill();
  // mouth
  ctx.beginPath(); ctx.arc(0, -9, 4, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.restore();
}
function drawBolt(b) {
  ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 4; ctx.shadowColor = '#fff6a0'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(b.x, b.y);
  b.pts.forEach((dx, i) => ctx.lineTo(b.x + (i % 2 ? 6 : -6) + dx * 0.3, b.y + 5 + i * 5));
  ctx.stroke(); ctx.shadowBlur = 0;
}
function drawLaser(l) {
  const a = l.life / 0.22;
  ctx.globalAlpha = a; ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 16;
  [-6, 6].forEach(dx => {
    ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(baby.x + dx, l.y); ctx.lineTo(baby.x + dx, 0); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(baby.x + dx, l.y); ctx.lineTo(baby.x + dx, 0); ctx.stroke();
  });
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}
function text(s, x, y, size, color = '#1d2a44', align = 'center') {
  ctx.font = `${size}px Bungee, Impact, sans-serif`; ctx.textAlign = align;
  ctx.lineWidth = 5; ctx.strokeStyle = '#ffffff'; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#4aa6ea'); g.addColorStop(1, '#cdeeff');
  ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, H + 20);
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(W - 60, 60, 30, 0, 7); ctx.fill();
  clouds.forEach(drawCloud);

  turtles.forEach(t => t.alive && drawTurtle(t));
  ctx.fillStyle = '#6fcf3f'; ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 1.5;
  spits.forEach(s => { ctx.beginPath(); ctx.ellipse(s.x, s.y, 4, 7, 0, 0, 7); ctx.fill(); ctx.stroke(); });
  bolts.forEach(drawBolt);
  lasers.forEach(drawLaser);
  pops.forEach(p => { ctx.globalAlpha = p.life * 2; text(p.flip ? 'BONK!' : 'TINK', p.x, p.y, 14, '#ff6b1a'); ctx.globalAlpha = 1; });
  if (state !== 'title') drawBaby();
  ctx.restore();

  text('SCORE ' + score, 12, 28, 16, '#1d2a44', 'left');
  text('WAVE ' + wave, W / 2, 28, 16);
  text('♥'.repeat(Math.max(lives, 0)), W - 12, 28, 18, '#ff2d55', 'right');

  if (state === 'title') {
    text('BABY ZUCCIO', W / 2, 150, 42, '#ff6b1a');
    text('VS TURTLES', W / 2, 205, 36, '#3f9b4a');
    const bx = baby.x, by = baby.y; baby.x = W / 2; baby.y = 310; drawBaby(); baby.x = bx; baby.y = by;
    text('Your best: ' + best, W / 2, 380, 14);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- SCREENS ----------
const $ = id => document.getElementById(id);
const screens = ['menu', 'board', 'paused', 'over'];
function show(name) {
  screens.forEach(n => $(n).hidden = n !== name);
  $('pause').hidden = !(state === 'play' || state === 'paused');
  $('pause').textContent = state === 'paused' ? 'Resume' : 'Pause';
  if (name === 'over') {
    $('overScore').textContent = 'Score ' + score + ' · Wave ' + wave;
    $('saveNote').textContent = '';
  }
}
function clearKeys() { for (const k in keys) keys[k] = false; }
function play() { audio(); clearKeys(); reset(); show(null); }
function toMenu() { state = 'title'; stopMusic(); clearKeys(); show('menu'); }
function togglePause() {
  if (state === 'play') { state = 'paused'; stopMusic(); clearKeys(); show('paused'); }
  else if (state === 'paused') { state = 'play'; last = performance.now(); startMusic(); show(null); }
}
$('play').onclick = play;
$('lb').onclick = () => show('board');
$('back').onclick = () => show('menu');
$('resume').onclick = togglePause;
$('pause').onclick = e => { togglePause(); e.currentTarget.blur(); };
$('over').addEventListener('pointerdown', toMenu);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

let playerName = '';
try { playerName = localStorage.getItem('bvt-name') || ''; } catch (e) {}
$('name').value = playerName;
$('name').addEventListener('input', () => {
  playerName = $('name').value.trim().slice(0, 12);
  try { localStorage.setItem('bvt-name', playerName); } catch (e) {}
});

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Enter') { e.target.blur(); play(); } return; }
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp'].includes(e.key)) e.preventDefault();
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }
  if (e.key === ' ' && state === 'over') { toMenu(); return; }
  if (e.key === ' ' && state === 'title' && $('board').hidden) { play(); return; }
  if (state === 'play') keys[e.key] = true;
});
addEventListener('keyup', e => { keys[e.key] = false; });
function hold(id, k) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => keys[k] = false));
}
hold('tl', 'L'); hold('tr', 'R'); hold('tz', 'Z'); hold('tx', 'X');

// fit the stage to the space available, keeping 3:4
function fit() {
  const r = $('wrap').getBoundingClientRect();
  const w = Math.min(r.width, r.height * W / H);
  $('stage').style.width = w + 'px'; $('stage').style.height = (w * H / W) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- SHARED LEADERBOARD ----------
let db = null, myId = null, canWrite = null;
function renderBoard(docs) {
  const ol = $('rows'); ol.textContent = '';
  docs.forEach((d, i) => {
    const v = d.data() || {};
    const li = document.createElement('li');
    if (d.id === myId) li.className = 'me';
    const a = document.createElement('span'); a.textContent = i + 1;
    const n = document.createElement('span'); n.className = 'nm'; n.textContent = String(v.name || 'Player').slice(0, 12) + (d.id === myId ? ' (you)' : '');
    const sc = document.createElement('span'); sc.textContent = (+v.score || 0) + ' · W' + (+v.wave || 1);
    li.append(a, n, sc); ol.append(li);
  });
  $('boardNote').textContent = docs.length ? 'Top 20 · your best score counts' : 'No scores yet. Play a round to be first.';
}
async function submitScore() {
  const note = $('saveNote');
  if (!db || !myId) { note.textContent = db === null ? 'Scores save to the leaderboard when you are signed in to claude.ai.' : ''; return; }
  if (canWrite === false) { note.textContent = 'Your link can view the leaderboard but not post to it.'; return; }
  if (score <= 0) return;
  const ref = db.doc('scores/' + myId);
  try {
    const snap = await ref.get();
    const prev = snap.exists ? +(snap.data().score || 0) : 0;
    if (score > prev) {
      await ref.set({ name: playerName || 'Player', score, wave, at: Date.now() });
      note.textContent = prev ? 'New personal best on the leaderboard!' : 'Score posted to the leaderboard!';
    } else note.textContent = 'Your leaderboard best is still ' + prev + '.';
  } catch (e) {
    canWrite = false;
    note.textContent = 'Could not post your score: your link can view the leaderboard but not post to it.';
  }
}
(async () => {
  if (!window.claude?.use) { $('boardNote').textContent = 'The leaderboard works when the game is opened from its claude.ai link.'; return; }
  const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!d) { $('boardNote').textContent = 'Sign in to claude.ai to see the leaderboard.'; return; }
  db = d;
  if (u) { myId = await u.id(); canWrite = await u.can('data.write'); }
  db.collection('scores').orderBy('score', 'desc').limit(20).onSnapshot(
    snap => renderBoard(snap.docs),
    () => { $('boardNote').textContent = 'The leaderboard stopped updating. Reload the page to try again.'; }
  );
})();
</script>
