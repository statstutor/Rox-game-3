<title>Baby Zuccio vs Turtles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one sky-blue screen, game canvas centered, controls under it. Single bright look in both themes. */
  :root {
    --sky-top: #5ab4f0;
    --sky-bottom: #c9ecff;
    --ink: #1d2a44;
    --sun: #ffd23f;
    --shell: #3f9b4a;
    --card: #ffffffcc;
    --display: "Bungee", "Impact", system-ui, sans-serif;
    --body: "Nunito", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    color: var(--ink);
    font-family: var(--body);
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 16px; box-sizing: border-box; gap: 8px; overflow: hidden;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; width: 100%; max-width: 480px; flex-wrap: wrap; }
  h1 { font-family: var(--display); font-size: 1.3rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
  button {
    font-family: var(--display); font-size: .85rem; color: var(--ink);
    background: var(--sun); border: 3px solid var(--ink); border-radius: 10px;
    padding: 6px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--ink);
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .bar .btns { display: flex; gap: 8px; }
  #wrap { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: center; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 12px; background: var(--sky-top); }
  .ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 16px 9%; box-sizing: border-box; }
  .ov[hidden] { display: none; }
  .ov.center { justify-content: center; }
  .ov.dim { background: #1d2a4466; border-radius: 12px; }
  .card { background: var(--card); border: 3px solid var(--ink); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(320px, 100%); box-sizing: border-box; text-align: center; }
  .card h2 { font-family: var(--display); margin: 0; font-size: 1.4rem; }
  .card p { margin: 0; font-weight: 800; }
  .ov .big { font-size: 1.1rem; padding: 10px 24px; width: min(240px, 100%); }
  label { font-weight: 800; font-size: .85rem; display: flex; gap: 8px; align-items: center; position: relative; }
  #zapfx { position: absolute; right: 2.4em; top: -64px; font-size: 52px; opacity: 0; pointer-events: none; filter: drop-shadow(0 0 8px #fff36b); }
  .zapping #zapfx { animation: strike .7s ease-in forwards; }
  .zapping input { animation: zapflash .7s; }
  @keyframes strike { 0% { opacity: 1; transform: translateY(-50px) scale(.6) rotate(-10deg); } 35% { opacity: 1; transform: translateY(46px) scale(1.25); } 100% { opacity: 0; transform: translateY(46px) scale(1.7); } }
  @keyframes zapflash { 30% { background: #fff36b; box-shadow: 0 0 28px #ffe14d; transform: translateX(-4px); } 42% { transform: translateX(4px); } 55% { transform: translateX(-2px); } 70% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .zapping #zapfx, .zapping input { animation: none; } }
  input { font: 800 1rem var(--body); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 8px; padding: 4px 8px; width: 9em; }
  .tap { font-size: .85rem; opacity: .8; }
  #boardCard { max-height: 88%; justify-content: flex-start; }
  #rows { list-style: none; margin: 0; padding: 0; width: 100%; overflow-y: auto; min-height: 0; flex: 1; }
  #rows li { display: grid; grid-template-columns: 2em 1fr auto; gap: 8px; padding: 6px 4px; border-bottom: 2px dashed #1d2a4433; font-weight: 800; text-align: left; font-variant-numeric: tabular-nums; }
  #rows li.me { background: var(--sun); border-radius: 6px; }
  #rows li span:first-child { font-family: var(--display); }
  #rows li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .note { font-size: .8rem; font-weight: 600; }
  .touch { display: flex; gap: 8px; width: 100%; max-width: 480px; }
  .touch button { flex: 1; padding: 12px 4px; font-size: .8rem; }
  .help { font-size: .8rem; margin: 0; text-align: center; }
  @media (hover: hover) and (pointer: fine) { .touch { display: none; } }
</style>

<div class="bar">
  <h1>Baby Zuccio vs Turtles</h1>
  <div class="btns">
    <button id="pause" hidden>Pause</button>
    <button id="music">Music: ON</button>
  </div>
</div>
<div id="wrap"><div id="stage">
  <canvas id="c" width="480" height="720"></canvas>
  <div class="ov" id="menu">
    <label for="name" id="nameLabel">Your name <input id="name" maxlength="12" placeholder="Player" autocomplete="off"><span id="zapfx" aria-hidden="true">⚡</span></label>
    <button class="big" id="play">Play</button>
    <button class="big" id="lb">Leaderboard</button>
  </div>
  <div class="ov center dim" id="board" hidden>
    <div class="card" id="boardCard">
      <h2>Leaderboard</h2>
      <ol id="rows"></ol>
      <p class="note" id="boardNote">Loading scores…</p>
      <button id="back">Back</button>
    </div>
  </div>
  <div class="ov center dim" id="paused" hidden>
    <div class="card"><h2>Paused</h2><button class="big" id="resume">Resume</button><p class="tap">or press P</p></div>
  </div>
  <div class="ov center dim" id="over" hidden>
    <div class="card">
      <h2>SKILL ISSUE</h2>
      <p id="overScore"></p>
      <p class="note" id="saveNote"></p>
      <p class="tap">Tap anywhere for the main menu</p>
    </div>
  </div>
</div></div>
<p class="help">← → move · Space = hand lightning · X or ↑ = eye lasers · P = pause</p>
<div class="touch">
  <button id="tl">◀</button>
  <button id="tz">⚡ Zap</button>
  <button id="tx">👀 Laser</button>
  <button id="tr">▶</button>
</div>

// ---------- GAME ----------
let state = 'title', score = 0, lives = 3, wave = 1, best = 0;
try { best = +localStorage.getItem('bvt-best-2') || 0; } catch (e) {}
const baby = { x: W / 2, y: H - 60, w: 50, cool: 0, lcool: 0, hurt: 0 };
let turtles = [], bolts = [], lasers = [], spits = [], pops = [], clouds = [];
let dir = 1, tSpeed = 30, shake = 0, diveTimer = 3;
// the flying baguette sandwich: zips across the top; shoot it and catch it for a heart
let sands = [], sandTimer = 10;
// every 4th wave is a boss wave: the Pug
let boss = null, banner = null;
const MAX_LIVES = 3;
// where a turtle actually is: its formation slot, or its dive path
const pos = t => t.dive || t;
const keys = {};

for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: Math.random() * H * 0.8, s: 0.6 + Math.random() * 0.8, v: 6 + Math.random() * 10 });

function newWave() {
  turtles = []; boss = null;
  if (wave % 4 === 0) { // boss wave
    const lvl = wave / 4, hp = 50 + lvl * 25;
    const kind = lvl % 2 ? 'pug' : 'sara'; // wave 4: Capy, wave 8: Sara, then they take turns
    boss = { kind, name: kind === 'pug' ? 'CAPY' : 'SARA', x: W / 2, y: -90, homeY: 150, hp, max: hp, vx: 90 + lvl * 15, t: 0, mode: 'enter', modeT: 0, attackT: 2.5, flash: 0, beamX: 0, lvl, dying: 0 };
    banner = { text: kind === 'pug' ? 'BOSS: CAPY THE PUG' : 'BOSS: BABY SARA', life: 2.5 };
    spits = []; bolts = []; lasers = []; diveTimer = 99; return;
  }
  const rows = Math.min(3 + wave, 6), cols = 7;
  const divers = wave >= 3 ? Math.min(wave, 7) : 0; // flying turtles join from wave 3
  for (let i = 0; i < divers; i++)
    turtles.push({ x: 240 + (i - (divers - 1) / 2) * 58, y: 82, alive: true, hp: 1, wob: Math.random() * 6, diver: true, dive: null });
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    turtles.push({ x: 60 + c * 58, y: 128 + r * 46, alive: true, hp: r === 0 && wave > 1 ? 2 : 1, wob: Math.random() * 6 });
  diveTimer = 2.5; dir = 1; tSpeed = 26 + wave * 8; spits = []; bolts = []; lasers = [];
}
function reset() {
  step = 0; // game tune starts from the top
  sands = []; sandTimer = 10; score = 0; lives = 3; wave = 1; baby.x = W / 2; baby.hurt = 0; newWave(); state = 'play'; startMusic(); }

function zigzag(x, y) { const pts = []; for (let i = 0; i < 6; i++) pts.push((Math.random() - 0.5) * 10); return { x, y, pts, vy: -520 }; }
function fireBolts() {
  if (baby.cool > 0) return; baby.cool = 0.28;
  bolts.push(zigzag(baby.x - 26, baby.y - 4), zigzag(baby.x + 26, baby.y - 4)); sfx.zap();
}
function fireLaser() {
  if (baby.lcool > 0) return; baby.lcool = 0.9;
  lasers.push({ x: baby.x, y: baby.y - 38, life: 0.22, hit: false }); sfx.laser();
}

function hitTurtle(t) {
  t.hp--; sfx.bonk();
  const p = pos(t);
  if (t.hp <= 0) { t.alive = false; score += (t.dive ? 50 : t.diver ? 20 : 10) * wave; pops.push({ x: p.x, y: p.y, life: 0.5, flip: true }); }
  else pops.push({ x: p.x, y: p.y, life: 0.25 });
}

function update(dt) {
  clouds.forEach(c => { c.x += c.v * dt; if (c.x > W + 80) c.x = -80; });
  pops = pops.filter(p => (p.life -= dt) > 0);
  if (shake > 0) shake -= dt;
  if (state !== 'play') return;

  const sp = 260;
  if (keys.ArrowLeft || keys.a || keys.L) baby.x -= sp * dt;
  if (keys.ArrowRight || keys.d || keys.R) baby.x += sp * dt;
  baby.x = Math.max(30, Math.min(W - 30, baby.x));
  baby.cool -= dt; baby.lcool -= dt; baby.hurt -= dt;
  if (keys[' '] || keys.Z) fireBolts();
  if (keys.x || keys.ArrowUp || keys.X) fireLaser();

  // turtles march
  const alive = turtles.filter(t => t.alive);
  const speed = tSpeed + (1 - alive.length / turtles.length) * 90;
  let edge = false;
  alive.forEach(t => { t.x += dir * speed * dt; t.wob += dt * 8; if (!t.dive && (t.x < 26 || t.x > W - 26)) edge = true; });
  if (edge) { dir *= -1; alive.forEach(t => { t.x += dir * 4; if (!t.minion) t.y += 18; }); }
  // flying turtles peel off and swoop down Galaga-style
  diveTimer -= dt;
  if (diveTimer <= 0) {
    diveTimer = Math.max(1, 3.2 - wave * 0.35) * (0.7 + Math.random() * 0.6);
    const ready = alive.filter(t => t.diver && !t.dive);
    if (ready.length) {
      const t = ready[Math.floor(Math.random() * ready.length)];
      const side = t.x < W / 2 ? -1 : 1;
      t.dive = { x: t.x, y: t.y, vx: side * 140, vy: -230, phase: 'swoop', time: 0, spat: 0, ang: 0 };
      sfx.dive();
    }
  }
  alive.forEach(t => {
    const d = t.dive; if (!d) return;
    d.time += dt;
    if (d.phase === 'swoop') {
      d.vy = Math.min(d.vy + 520 * dt, 260 + wave * 20);         // arc up, then plunge
      const want = (baby.x - d.x) * 1.6 + Math.sin(d.time * 5) * 120; // home in on the baby, wiggling
      d.vx += (want - d.vx) * Math.min(1, dt * 2.5);
      d.x = Math.max(16, Math.min(W - 16, d.x + d.vx * dt)); d.y += d.vy * dt;
      d.ang = Math.atan2(d.vy, d.vx) - Math.PI / 2;
      if (d.spat < 2 && d.y > 200 + d.spat * 140 && d.y < baby.y - 120) { d.spat++; spits.push({ x: d.x, y: d.y + 16, vy: d.vy + 120 }); }
      if (baby.hurt <= 0 && Math.abs(d.x - baby.x) < 26 && Math.abs(d.y - (baby.y - 10)) < 34) { t.alive = false; pops.push({ x: d.x, y: d.y, life: 0.5, flip: true }); ouch(); }

      const dx = t.x - d.x, dy = t.y - d.y, dist = Math.hypot(dx, dy), step = 260 * dt;

    }
  });

  // turtles spit
  if (alive.length && Math.random() < dt * (0.9 + wave * 0.35)) {
    const t = alive[Math.floor(Math.random() * alive.length)];
    if (t.alive && !t.dive) spits.push({ x: t.x, y: t.y + 16, vy: 150 + wave * 15 });
  }

  if (boss) updateBoss(dt);
  if (banner && (banner.life -= dt) <= 0) banner = null;

  // baguette sandwiches (two at once from wave 5)
  if (!sands.length) {
    sandTimer -= dt;
    if (sandTimer <= 0) {
      const from = Math.random() < 0.5 ? -1 : 1, n = wave >= 5 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const side = i ? -from : from; // the second one comes from the other side
        sands.push({ x: side < 0 ? -50 : W + 50, y: 50, vx: -side * (190 + wave * 15) * (i ? 0.85 : 1), passes: 2 + Math.floor(Math.random() * 3), falling: false, vy: 0, spin: 0, t: i * 1.7 });
      }
      playTaunt();
    }
  }
  sands.forEach(sd => {
    if (!sd.falling) {
      sd.t += dt; sd.x += sd.vx * dt; sd.y = 50 + Math.sin(sd.t * 6) * 4;
      if ((sd.vx > 0 && sd.x > W + 50) || (sd.vx < 0 && sd.x < -50)) {
        if (--sd.passes <= 0) { sd.gone = true; if (!sands.some(o => !o.gone && !o.falling)) stopTaunt(); }
        else { sd.vx *= -1; playTaunt(); }
      }
    } else { // knocked out of the sky: catch it!
      sd.vy = Math.min(sd.vy + 260 * dt, 260); sd.y += sd.vy * dt; sd.spin += dt * 5;
      if (Math.abs(sd.x - baby.x) < 40 && Math.abs(sd.y - (baby.y - 6)) < 36) {
        if (lives < MAX_LIVES) { lives++; pops.push({ x: sd.x, y: sd.y - 30, life: 0.8, text: '+1 ♥' }); }
        else { score += 500; pops.push({ x: sd.x, y: sd.y - 30, life: 0.8, text: '+500' }); }
        sfx.yum(); sd.gone = true;
      } else if (sd.y > H + 30) sd.gone = true;
    }
  });
  if (sands.length) { sands = sands.filter(sd => !sd.gone); if (!sands.length) sandTimer = (wave >= 5 ? 11 : 14) + Math.random() * (wave >= 5 ? 8 : 10); } // a little more often from wave 5
  const hitSand = (x, w, y) => {
    const sd = sands.find(o => !o.falling && Math.abs(x - o.x) <= w && (y === undefined || Math.abs(y - o.y) < 14));
    if (!sd) return false;
    stopTaunt(); sd.falling = true; sd.vy = -60; score += 100 * wave; shake = 0.15;
    pops.push({ x: sd.x, y: sd.y + 20, life: 0.6, text: 'SPLAT!' }); sfx.splat();
    return true;
  };

  bolts.forEach(b => { b.y += b.vy * dt; });
  bolts = bolts.filter(b => {
    if (b.y < -30) return false;
    if (hitSand(b.x, 32, b.y)) return false;
    if (boss && !boss.dying && boss.mode !== 'enter' && Math.abs(b.x - boss.x) < 56 && Math.abs(b.y - boss.y) < 50) { hurtBoss(1); return false; }
    for (const t of alive) { const p = pos(t); if (t.alive && Math.abs(b.x - p.x) < 22 && Math.abs(b.y - p.y) < 18) { hitTurtle(t); return false; } }
    return true;
  });
  lasers = lasers.filter(l => {
    if (!l.hit) { // eye lasers hit every turtle in a narrow column
      l.hit = true;
      alive.forEach(t => { if (t.alive && Math.abs(pos(t).x - l.x) < 26) hitTurtle(t); });
      while (hitSand(l.x, 34));
      if (boss && !boss.dying && boss.mode !== 'enter' && Math.abs(l.x - boss.x) < 60) hurtBoss(4);
      shake = 0.12;
    }
    return (l.life -= dt) > 0;
  });
  spits.forEach(s => { s.y += s.vy * dt; s.x += (s.vx || 0) * dt; });
  spits = spits.filter(s => {
    if (s.y > H + 20 || s.x < -40 || s.x > W + 40) return false;
    const r = s.woof ? 16 : 0;
    if (baby.hurt <= 0 && Math.abs(s.x - baby.x) < 22 + r && Math.abs(s.y - (baby.y - 10)) < 30 + r / 2) { ouch(); return false; }
    return true;
  });

  if (alive.some(t => t.alive && t.y > baby.y - 40)) { lives = 0; ouch(); }
  if (!boss && !turtles.some(t => t.alive)) { wave++; score += 100; newWave(); }
}

// ---------- BOSSES: Capy the pug and Baby Sara ----------
function hurtBoss(n) {
  boss.hp -= n; boss.flash = 0.12; sfx.bonk();
  if (boss.hp <= 0) {
    boss.hp = 0; boss.dying = 2.2; boss.mode = 'dead'; boss.kind === 'pug' ? sfx.woof() : sfx.scream(); shake = 0.6;
    score += 1000 * boss.lvl;
    turtles.forEach(t => { if (t.alive) { t.alive = false; const p = pos(t); pops.push({ x: p.x, y: p.y, life: 0.5, flip: true }); } });
    spits = [];
  }
}
function bossAttack() {
  const b = boss, angry = b.hp < b.max / 2;

  if (b.hp < b.max * 0.75 && turtles.filter(t => t.alive && t.minion).length < 4) moves.push('summon');
  const m = moves[Math.floor(Math.random() * moves.length)];
  const sara = b.kind === 'sara';
  if (m === 'drool') { // fan of drool (Sara squirts milk)
    const n = angry ? 7 : 5;
    for (let i = 0; i < n; i++) { const a = (i - (n - 1) / 2) * 0.22; spits.push({ x: b.x, y: b.y + 40, vx: Math.sin(a) * 220, vy: Math.cos(a) * 220, milk: sara }); }
    b.mode = 'idle'; b.mouth = 0.4;
  } else if (m === 'woof') { // big slow barks aimed at the baby
    const n = angry ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const dx = baby.x - b.x + (i - (n - 1) / 2) * 70, dy = baby.y - b.y, d = Math.hypot(dx, dy);
      spits.push({ x: b.x, y: b.y + 40, vx: dx / d * 170, vy: dy / d * 170, woof: true, label: sara ? 'SARAAAA!!!' : 'WOOF!' });
    }
    if (sara) { sfx.scream(); b.shout = 1.2; } else sfx.woof();
    b.mode = 'idle'; b.mouth = sara ? 1.2 : 0.5;
  } else if (m === 'tongue') { // Galaga-style beam: warning, then fire (Capy's tongue laser, Sara's eye lasers)
    b.mode = 'tongueWarn'; b.modeT = 0.9; b.beamX = b.x;
    if (!sara) sfx.snort();
  } else if (m === 'charge') { // swoop down at the baby and back
    b.mode = 'charge'; b.targetX = baby.x; b.vy = 380 + b.lvl * 40;
    if (sara) { sfx.scream(); b.shout = 1.4; } // Sara screams every time she drops down
  } else { // call in flying turtle minions
    for (let i = 0; i < (angry ? 3 : 2); i++) {
      turtles.push({ x: 60 + Math.random() * (W - 120), y: -80, alive: true, hp: 1, wob: 0, diver: true, minion: true,
        dive: { x: b.x + (i - 0.5) * 60, y: b.y, vx: (i ? 1 : -1) * 140, vy: -200, phase: 'swoop', time: 0, spat: 0, ang: 0 } });
    }

}
function updateBoss(dt) {
  const b = boss;
  b.t += dt; b.flash -= dt; b.mouth = Math.max(0, (b.mouth || 0) - dt); b.shout = (b.shout || 0) - dt;
  if (b.mode === 'dead') {
    b.dying -= dt; b.y -= 20 * dt;
    if (Math.random() < dt * 8) pops.push({ x: b.x + (Math.random() - 0.5) * 120, y: b.y + (Math.random() - 0.5) * 90, life: 0.5, text: b.kind === 'pug' ? 'YIP!' : 'SARAAAA!' });
    if (b.dying <= 0) { const nm = b.name; boss = null; wave++; score += 100; newWave(); banner = { text: nm + ' DEFEATED!', life: 2 }; }
    return;
  }
  if (b.mode === 'enter') { b.y += 120 * dt; if (b.y >= b.homeY) { b.y = b.homeY; b.mode = 'idle'; } return; }
  const angry = b.hp < b.max / 2, sp = b.vx * (angry ? 1.5 : 1);

    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(sd * 24, -6, 13, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1d2a44'; ctx.beginPath(); ctx.arc(sd * 24 + look, -3, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(sd * 24 + look - 2, -6, 2, 0, 7); ctx.fill();

  });

  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(0, 12, 10, 7, 0, 0, 7); ctx.fill();
  // mouth + tongue
  ctx.strokeStyle = '#111'; ctx.beginPath(); ctx.moveTo(0, 19); ctx.lineTo(0, 26); ctx.moveTo(-14, 30); ctx.quadraticCurveTo(0, 22, 14, 30); ctx.stroke();
  const open = b.mouth > 0;
  ctx.fillStyle = '#ff6f9f'; ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(4, open ? 40 : 33, 8, open ? 14 : 6, 0, 0, Math.PI); ctx.fill(); ctx.stroke();
  // crown, because it's the boss
  ctx.fillStyle = '#ffd23f'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-22, -46); ctx.lineTo(-22, -66); ctx.lineTo(-11, -56); ctx.lineTo(0, -72); ctx.lineTo(11, -56); ctx.lineTo(22, -66); ctx.lineTo(22, -46); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  drawBossBar(b);
}
function drawBossBar(b) {
  const angry = b.hp < b.max / 2;
  if (b.mode !== 'dead') {
    const bw = 300, x0 = (W - bw) / 2, y0 = H - 16;
    ctx.fillStyle = '#1d2a44'; ctx.fillRect(x0 - 3, y0 - 3, bw + 6, 14);
    ctx.fillStyle = angry ? '#ff2d55' : '#ffb000'; ctx.fillRect(x0, y0, bw * b.hp / b.max, 8);
    text(b.name, x0 - 8, y0 + 9, 12, '#1d2a44', 'right');
  }
}
function drawSara(b) {
  const angry = b.hp < b.max / 2, lasering = b.mode === 'tongueWarn' || b.mode === 'tongue';
  if (lasering) { // twin eye lasers, like Baby Zuccio's
    const warn = b.mode === 'tongueWarn';
    [-1, 1].forEach(sd => {
      const x = b.beamX + sd * 12;
      ctx.fillStyle = warn ? (Math.floor(b.t * 12) % 2 ? '#ff2d5555' : '#ff2d5522') : '#ff2d55';
      ctx.fillRect(x - (warn ? 6 : 9), b.y, warn ? 12 : 18, H);
      if (!warn) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 3, b.y, 6, H); }
    });
  }
  ctx.save(); ctx.translate(b.x, b.y);
  if (b.mode === 'dead') ctx.rotate(Math.sin(b.t * 30) * 0.15);
  ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 3;
  // head (bald, with a shine)
  ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#ffd9b8';
  ctx.beginPath(); ctx.arc(0, 0, 52, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffffffaa'; ctx.beginPath(); ctx.ellipse(-20, -34, 13, 6, -0.5, 0, 7); ctx.fill();
  // little ears
  ctx.fillStyle = '#ffd9b8'; [-1, 1].forEach(sd => { ctx.beginPath(); ctx.arc(sd * 54, 4, 9, sd > 0 ? -1.4 : 1.7, sd > 0 ? 1.4 : 4.6); ctx.fill(); ctx.stroke(); });
  // cheeks
  ctx.fillStyle = '#ff9fb588'; [-1, 1].forEach(sd => { ctx.beginPath(); ctx.arc(sd * 32, 14, 9, 0, 7); ctx.fill(); });
  // eyes; glow red when lasering
  const look = Math.max(-4, Math.min(4, (baby.x - b.x) / 40));
  [-1, 1].forEach(sd => {
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(sd * 18, -6, 10, 12, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = lasering ? '#ff2d55' : '#1d2a44'; ctx.beginPath(); ctx.arc(sd * 18 + look, -4, 6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 2;
    if (angry) { ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(sd * 30, -28); ctx.lineTo(sd * 8, -20); ctx.stroke(); }
    ctx.lineWidth = 3;
  });
  // mouth: a grumpy line, or a huge screaming mouth
  if (b.mouth > 0 || b.mode === 'charge') {
    ctx.fillStyle = '#7a1f2b'; ctx.beginPath(); ctx.ellipse(0, 26, 15, 14, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff6f9f'; ctx.beginPath(); ctx.ellipse(0, 34, 9, 5, 0, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(-10, 28); ctx.quadraticCurveTo(0, 22, 10, 28); ctx.stroke();
  }
  ctx.restore();
  if (b.shout > 0) text('SARAAAA!!!', Math.max(110, Math.min(W - 110, b.x)), b.y - 86 + Math.sin(b.t * 40) * 2, 26, '#d6336c');
}
function ouch() {
  lives--; baby.hurt = 1.5; shake = 0.3; sfx.ouch();
  if (lives <= 0) {
    state = 'over'; stopMusic(); stopTaunt();
    if (score > best) { best = score; try { localStorage.setItem('bvt-best-2', best); } catch (e) {} }
    show('over'); submitScore();
  }
}

// ---------- DRAW ----------
function drawCloud(c) {
  ctx.fillStyle = '#ffffffd9';
  ctx.beginPath();
  [[0, 0, 22], [22, -8, 26], [46, 0, 20], [22, 8, 22]].forEach(([dx, dy, r]) => {
    ctx.moveTo(c.x + dx * c.s + r * c.s, c.y + dy * c.s); ctx.arc(c.x + dx * c.s, c.y + dy * c.s, r * c.s, 0, 7);
  });
  ctx.fill();
}
function drawTurtle(t) {
  const legs = Math.sin(t.wob) * 3;
  const p = pos(t);
  ctx.save(); ctx.translate(p.x, p.y);
  if (t.dive) ctx.rotate(t.dive.ang);
  ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 2;
  if (t.diver) { // flapping wings
    const flap = 0.6 + Math.abs(Math.sin(t.wob * (t.dive ? 2.5 : 1))) * 0.6;
    ctx.fillStyle = '#ffffff';
    [-1, 1].forEach(sd => { ctx.beginPath(); ctx.ellipse(sd * 22, -4, 14, 7 * flap, sd * -0.5, 0, 7); ctx.fill(); ctx.stroke(); });
  }
  ctx.fillStyle = '#8fd16a';
  // legs
  [[-14, 10], [14, 10], [-14, -6], [14, -6]].forEach(([lx, ly], i) => {
    ctx.beginPath(); ctx.ellipse(lx + (i % 2 ? 4 : -4), ly + (i < 2 ? legs : -legs), 6, 4, 0, 0, 7); ctx.fill(); ctx.stroke();
  });
  // head (looks down at baby)
  ctx.beginPath(); ctx.arc(0, 16, 8, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1d2a44'; ctx.beginPath(); ctx.arc(-3, 18, 1.6, 0, 7); ctx.arc(3, 18, 1.6, 0, 7); ctx.fill();
  // shell
  ctx.fillStyle = t.diver ? '#e8473c' : t.hp > 1 ? '#2e6b8f' : '#3f9b4a';
  ctx.beginPath(); ctx.ellipse(0, 0, 19, 15, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#ffffff66'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.lineTo(Math.cos(a) * 7, Math.sin(a) * 6); }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}
function drawSandwich(sand) {
  const { x, y } = sand;
  ctx.save(); ctx.translate(x, y);
  if (sand.falling) ctx.rotate(Math.sin(sand.spin) * 0.6);
  else ctx.scale(sand.vx > 0 ? 1 : -1, 1);
  ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 2;
  if (!sand.falling) { // little wings
    const f = 0.5 + Math.abs(Math.sin(sand.t * 18)) * 0.7;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(-6, -12, 12, 6 * f, -0.4, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(8, -12, 12, 6 * f, 0.4, 0, 7); ctx.fill(); ctx.stroke();
  }
  // bottom bun, fillings, top bun
  ctx.fillStyle = '#d99a4e'; ctx.beginPath(); ctx.roundRect(-30, 2, 60, 9, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5cc04a'; ctx.beginPath(); ctx.moveTo(-30, 2);
  for (let i = 0; i <= 12; i++) ctx.lineTo(-30 + i * 5, i % 2 ? 5 : 0);
  ctx.lineTo(30, -2); ctx.lineTo(-30, -2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8473c'; [-18, -2, 14].forEach(cx => { ctx.beginPath(); ctx.arc(cx, -2, 4, Math.PI, 0); ctx.fill(); });
  ctx.fillStyle = '#f2c14e'; ctx.fillRect(-26, -4, 52, 3); // cheese
  ctx.fillStyle = '#e0a458'; ctx.beginPath(); ctx.ellipse(0, -8, 31, 8, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#a8662a'; ctx.lineWidth = 2;
  [-16, -4, 8, 20].forEach(sx => { ctx.beginPath(); ctx.moveTo(sx - 4, -9); ctx.lineTo(sx + 3, -14); ctx.stroke(); }); // baguette slashes
  ctx.restore();
}
function drawBaby() {
  if (baby.hurt > 0 && Math.floor(baby.hurt * 10) % 2) return;
  const { x, y } = baby;
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.fillStyle = '#ffd9b8';
  // arms out to the sides, hands up
  ctx.beginPath(); ctx.moveTo(-12, 8); ctx.lineTo(-26, -2); ctx.moveTo(12, 8); ctx.lineTo(26, -2); ctx.stroke();
  ctx.beginPath(); ctx.arc(-26, -4, 5, 0, 7); ctx.arc(26, -4, 5, 0, 7); ctx.fill(); ctx.stroke();
  // diaper body
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(0, 18, 14, 13, 0, 0, 7); ctx.fill(); ctx.stroke();
  // head
  ctx.fillStyle = '#ffd9b8';
  ctx.beginPath(); ctx.arc(0, -16, 18, 0, 7); ctx.fill(); ctx.stroke();
  // the one curly hair
  ctx.beginPath(); ctx.moveTo(0, -34);
  ctx.bezierCurveTo(-2, -44, 8, -48, 9, -42); ctx.bezierCurveTo(10, -37, 3, -37, 4, -41); ctx.stroke();
  // eyes (glow when laser is ready)
  const ready = baby.lcool <= 0;
  ctx.fillStyle = ready ? '#ff2d55' : '#1d2a44';
  ctx.beginPath(); ctx.arc(-6, -18, 2.6, 0, 7); ctx.arc(6, -18, 2.6, 0, 7); ctx.fill();
  // mouth
  ctx.beginPath(); ctx.arc(0, -9, 4, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.restore();
}
function drawBolt(b) {
  ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 4; ctx.shadowColor = '#fff6a0'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(b.x, b.y);
  b.pts.forEach((dx, i) => ctx.lineTo(b.x + (i % 2 ? 6 : -6) + dx * 0.3, b.y + 5 + i * 5));
  ctx.stroke(); ctx.shadowBlur = 0;
}
function drawLaser(l) {
  const a = l.life / 0.22;
  ctx.globalAlpha = a; ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 16;
  [-6, 6].forEach(dx => {
    ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(baby.x + dx, l.y); ctx.lineTo(baby.x + dx, 0); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(baby.x + dx, l.y); ctx.lineTo(baby.x + dx, 0); ctx.stroke();
  });
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}
function text(s, x, y, size, color = '#1d2a44', align = 'center') {
  ctx.font = `${size}px Bungee, Impact, sans-serif`; ctx.textAlign = align;
  ctx.lineWidth = 5; ctx.strokeStyle = '#ffffff'; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#4aa6ea'); g.addColorStop(1, '#cdeeff');
  ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, H + 20);
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(W - 60, 60, 30, 0, 7); ctx.fill();
  clouds.forEach(drawCloud);

  turtles.forEach(t => t.alive && drawTurtle(t));
  if (boss) drawBoss();
  sands.forEach(drawSandwich);
  ctx.fillStyle = '#6fcf3f'; ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 1.5;
  spits.forEach(s => { if (!s.woof) { ctx.fillStyle = s.milk ? '#ffffff' : '#6fcf3f'; ctx.beginPath(); ctx.ellipse(s.x, s.y, 4, 7, 0, 0, 7); ctx.fill(); ctx.stroke(); } });
  spits.forEach(s => { if (s.woof) text(s.label || 'WOOF!', s.x, s.y + 6, (s.label === 'WOOF!' ? 20 : 14) + Math.sin(performance.now() / 60) * 2, s.label === 'WOOF!' ? '#8a5a2b' : '#d6336c'); });
  bolts.forEach(drawBolt);
  lasers.forEach(drawLaser);
  pops.forEach(p => { ctx.globalAlpha = p.life * 2; text(p.text || (p.flip ? 'BONK!' : 'TINK'), p.x, p.y, p.text ? 18 : 14, p.text ? '#e8473c' : '#ff6b1a'); ctx.globalAlpha = 1; });
  if (state !== 'title') drawBaby();
  ctx.restore();

  text('SCORE ' + score, 12, 28, 16, '#1d2a44', 'left');
  text(boss ? 'BOSS!' : 'WAVE ' + wave, W / 2, 28, 16, boss ? '#ff2d55' : '#1d2a44');
  if (banner && state === 'play') { ctx.globalAlpha = Math.min(1, banner.life * 2); text(banner.text, W / 2, H / 2, 26, '#ff6b1a'); ctx.globalAlpha = 1; }
  text('♥'.repeat(Math.max(lives, 0)), W - 12, 28, 18, '#ff2d55', 'right');

  if (state === 'title') {
    text('BABY ZUCCIO', W / 2, 150, 42, '#ff6b1a');
    text('VS TURTLES', W / 2, 205, 36, '#3f9b4a');
    const bx = baby.x, by = baby.y; baby.x = W / 2; baby.y = 310; drawBaby(); baby.x = bx; baby.y = by;
    text('Your best: ' + best, W / 2, 380, 14);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- SCREENS ----------
const $ = id => document.getElementById(id);
const screens = ['menu', 'board', 'paused', 'over'];
function show(name) {
  screens.forEach(n => $(n).hidden = n !== name);
  $('pause').hidden = !(state === 'play' || state === 'paused');
  $('pause').textContent = state === 'paused' ? 'Resume' : 'Pause';
  if (name === 'over') {
    $('overScore').textContent = 'Score ' + score + ' · Wave ' + wave;
    $('saveNote').textContent = '';
  }
}
function clearKeys() { for (const k in keys) keys[k] = false; }
function play() { audio(); clearKeys(); reset(); show(null); }
function toMenu() { state = 'title'; stopMusic(); stopTaunt(); clearKeys(); show('menu'); startMusic(); }
// browsers only allow sound after a tap or key press, so menu music starts on the first one
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { if (state === 'title' && musicOn && !musicTimer) { audio(); startMusic(); } }));
function togglePause() {
  if (state === 'play') { state = 'paused'; stopMusic(); stopTaunt(); clearKeys(); show('paused'); }
  else if (state === 'paused') { state = 'play'; last = performance.now(); startMusic(); show(null); }
}
$('play').onclick = play;
$('lb').onclick = () => show('board');
$('back').onclick = () => show('menu');
$('resume').onclick = togglePause;
$('pause').onclick = e => { togglePause(); e.currentTarget.blur(); };
$('over').addEventListener('pointerdown', toMenu);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

let playerName = '';
try { playerName = localStorage.getItem('bvt-name') || ''; } catch (e) {}
$('name').value = playerName;
// typing "Baby Zuccio" gets struck by lightning and earns a bolt
function zapName() {
  const lbl = $('nameLabel');
  lbl.classList.remove('zapping'); void lbl.offsetWidth; lbl.classList.add('zapping');
  sfx.zap(); setTimeout(() => sfx.zap(), 120);
  setTimeout(() => { $('name').value = 'Baby Zuccio⚡'; $('name').dispatchEvent(new Event('input')); }, 260);
  setTimeout(() => lbl.classList.remove('zapping'), 800);
}
$('name').addEventListener('input', () => {
  if ($('name').value.trim().toLowerCase() === 'baby zuccio') zapName();
  playerName = $('name').value.trim().slice(0, 12);
  try { localStorage.setItem('bvt-name', playerName); } catch (e) {}
});

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Enter') { e.target.blur(); play(); } return; }
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp'].includes(e.key)) e.preventDefault();
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }
  if (e.key === ' ' && state === 'over') { toMenu(); return; }
  if (e.key === ' ' && state === 'title' && $('board').hidden) { play(); return; }
  if (state === 'play') keys[e.key] = true;
});
addEventListener('keyup', e => { keys[e.key] = false; });
function hold(id, k) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => keys[k] = false));
}
hold('tl', 'L'); hold('tr', 'R'); hold('tz', 'Z'); hold('tx', 'X');

// fit the stage to the space available, keeping 3:4
function fit() {
  const r = $('wrap').getBoundingClientRect();
  const w = Math.min(r.width, r.height * W / H);
  $('stage').style.width = w + 'px'; $('stage').style.height = (w * H / W) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- LEADERBOARD (kept on this device) ----------
// one row per name; each name keeps its best score
const LB_KEY = 'bvt-board-1';
let lastName = null;
function loadBoard() {
  try { const v = JSON.parse(localStorage.getItem(LB_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}
function saveBoard(list) { try { localStorage.setItem(LB_KEY, JSON.stringify(list)); return true; } catch (e) { return false; } }
function renderBoard() {
  const list = loadBoard().sort((x, y) => y.score - x.score).slice(0, 20);
  const ol = $('rows'); ol.textContent = '';
  list.forEach((v, i) => {
    const li = document.createElement('li');
    if (v.name === lastName) li.className = 'me';
    const a = document.createElement('span'); a.textContent = i + 1;
    const n = document.createElement('span'); n.className = 'nm'; n.textContent = String(v.name || 'Player').slice(0, 12);
    const sc = document.createElement('span'); sc.textContent = (+v.score || 0) + ' · W' + (+v.wave || 1);
    li.append(a, n, sc); ol.append(li);
  });
  $('boardNote').textContent = list.length ? 'Top 20 on this device · each name keeps its best score' : 'No scores yet. Play a round to be first.';
}
function submitScore() {
  const note = $('saveNote');
  if (score <= 0) return;
  const name = playerName || 'Player', list = loadBoard();
  const row = list.find(r => r.name === name);
  const prev = row ? +row.score || 0 : 0;
  lastName = name;
  if (score > prev) {
    if (row) Object.assign(row, { score, wave, at: Date.now() });
    else list.push({ name, score, wave, at: Date.now() });
    list.sort((x, y) => y.score - x.score);
    note.textContent = saveBoard(list.slice(0, 50))
      ? (prev ? 'New personal best on the leaderboard!' : 'Score added to the leaderboard!')
      : 'This browser is not letting the game save scores.';
  } else note.textContent = name + "'s best is still " + prev + '.';
  renderBoard();
}
$('lb').addEventListener('click', renderBoard);
renderBoard();
</script>
